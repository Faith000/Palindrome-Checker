<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bubblegum+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <title>Palindrome Checker</title>
  </head>
  <body>
    <div class="content">
      <div class="question">
        <h1 id="question-01">IS</h1>
        <h1 id="question-02">IT</h1>
        <h1 id="question-03">A</h1>
        <h1 id="question-04">PALINDROME</h1>
        <h1 id="question-05">?</h1>
      </div>
      <div class="text-box">
        <div class="textbox-content">
          <p style="color: #6e330c;" id="enter">
            Enter in text to check for a palindrome:
          </p>
          <input type="text" id="text-input" />
          <button id="check-btn">Check</button>
          <div id="result"></div>
        </div>
      </div>
      <div class="fact">
        <img class="lightbulb" src="images/lightbulb.svg" alt="" />A palindrome is a word, phrase,
        name, or number that reads the same forward or backward.
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
